services:
  - type: web
    name: dialysis-companion-api
    runtime: python
    plan: 0.5c-512mb
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /api/health
    disk:
      name: dialysis-companion-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/dialysis-admin.sqlite
      - key: TRUST_PROXY
        value: "1"
      - key: CORS_ORIGIN
        value: https://jo42sites.github.io
      - key: JWT_SECRET
        generateValue: true
      - key: MEDICAL_DATA_KEY
        generateValue: true
      - key: SITE_ADMIN_EMAIL
        sync: false
      - key: SITE_ADMIN_PASSWORD
        sync: false
