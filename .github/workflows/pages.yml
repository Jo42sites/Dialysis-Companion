name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Configure records and admin API
        env:
          ADMIN_API_URL: ${{ vars.ADMIN_API_URL }}
        run: |
          mkdir _site
          cp index.html dialysis.html daily-care.html emergency.html emergency-triage.js philhealth.html support.html account.html account.css interactive-guide.css interactive-guide.js admin.html admin.css admin.js styles.css app.js food-checker.js records.html records.css records.js _site/
          node scripts/configure-admin-api.js _site/records.html
          node scripts/configure-admin-api.js _site/admin.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
